name: Demo Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pruebas
        shell: pwsh
        run: dotnet test MiTiendita.sln --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath pruebas.txt

      - name: Compilar
        shell: pwsh
        run: dotnet build MiTiendita/MiTiendita.csproj -c Debug

      - name: ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "sin cambio de resolucion" }
          exit 0

      - name: Grabar demo
        shell: powershell
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + $env:Path
          $exe = Join-Path $PWD "MiTiendita/bin/Debug/net8.0-windows/MiTiendita.exe"
          ./demo/grabar.ps1 -Exe $exe -Salida (Join-Path $PWD "salida") -Repo $PWD

      - name: Publicar grabacion
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force salida | Out-Null
          Copy-Item pruebas.txt salida -ErrorAction SilentlyContinue
          Set-Location salida
          git init -b salida-demo
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "Grabacion"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" salida-demo
